---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - curl
      - gnupg2
    state: present

- name: Download OpenBao GPG public key
  ansible.builtin.get_url:
    url: https://openbao.org/assets/openbao-gpg-pub-20240618.asc
    dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-OpenBao
    owner: root
    group: root
    mode: "0644"

- name: Import OpenBao GPG signing key
  ansible.builtin.rpm_key:
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-OpenBao
    state: present
    fingerprint: "66D15FDD87287219C8E15478D200CD702853E6D0"

- name: Install Openbao
  ansible.builtin.dnf:
    name: "{{ openbao_rpm_url }}"
    state: present

- name: Ensure OpenBAO port is open in firewall
  ansible.posix.firewalld:
    port: "{{ openbao_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

- name: Create directory for OpenBAO TLS files
  ansible.builtin.file:
    path: /opt/openbao/tls
    state: directory
    mode: "0755"

- name: Check existing OpenBao TLS certificate
  ansible.builtin.stat:
    path: /opt/openbao/tls/tls.crt
  register: openbao_tls_cert

- name: Configure openssl.cnf
  ansible.builtin.template:
    src: openssl.cnf.j2
    dest: /opt/openbao/tls/openssl.cnf
    mode: "0644"
  register: openbao_tls_config

- name: Generate OpenSSL key and certificate
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 3650
    -newkey rsa:4096
    -keyout /opt/openbao/tls/tls.key
    -out /opt/openbao/tls/tls.crt
    -config /opt/openbao/tls/openssl.cnf
  when: >
    openbao_tls_config.changed or
    not openbao_tls_cert.stat.exists
  notify: Restart OpenBao

- name: chmod TLS key
  ansible.builtin.file:
    path: /opt/openbao/tls/tls.crt
    mode: "0644"

- name: chmod TLS key
  ansible.builtin.file:
    path: /opt/openbao/tls/tls.key
    mode: "0600"

- name: Validate seal configuration
  ansible.builtin.assert:
    that:
      - openbao_seal_type in ['shamir', 'pkcs11', 'transit']
    fail_msg: >-
      Unsupported seal type '{{ openbao_seal_type }}'.
      Supported types: shamir, pkcs11, transit.

- name: Configure selected seal
  ansible.builtin.include_tasks: seal.yaml

- name: Configure OpenBao
  ansible.builtin.include_tasks: configure.yaml

- name: Initialize OpenBao
  ansible.builtin.include_tasks: initialize.yaml