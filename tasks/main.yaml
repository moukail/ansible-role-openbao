---
- name: Validate seal configuration
  ansible.builtin.assert:
    that:
      - openbao_seal_type in ['shamir', 'pkcs11', 'transit']
    fail_msg: >-
      Unsupported seal type '{{ openbao_seal_type }}'.
      Supported types: shamir, pkcs11, transit.

- name: Ensure OpenBAO port is open in firewall
  ansible.posix.firewalld:
    port: "{{ openbao_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

- name: Install OpenBao
  ansible.builtin.include_tasks: install.yaml

- name: Configure TLS
  ansible.builtin.include_tasks: tls.yaml

- name: Configure OpenBao
  ansible.builtin.include_tasks: configure.yaml

- name: Initialize OpenBao
  ansible.builtin.include_tasks: initialize.yaml